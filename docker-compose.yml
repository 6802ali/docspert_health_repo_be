version: "3.9"

services:
  db:
    image: postgres:15
    container_name: docspert_db
    env_file:
      - .env/.postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: docspert_web
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env/.django
    depends_on:
      - db

volumes:
  postgres_data: